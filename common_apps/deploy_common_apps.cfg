############################################################################
# Source In Additional Config Files
############################################################################

source ../deploy_rke2.cfg


############################################################################
#   Kube-VIP Variables
############################################################################

# Kube-VIP Helm Install URL
# 
# The Helm repo to install Kube-VIP from.
#
# The upstream repo is: https://kube-vip.github.io/helm-charts
#
export KUBEVIP_HELM_REPO="https://kube-vip.github.io/helm-charts"


# Kube-VIP Helm Chart
#
# If this variable is set then the KUBEVIP_HELM_REPO is ignored and 
# this chart is used to install Kube-VIP instead.
#
# The AppCo chart is: oci://dp.apps.rancher.io/charts/kube-vip
#
export KUBEVIP_HELM_CHART=


# Version of Kube-VIP to Install
#
# If left empty the latest version will be installed.
#
export KUBEVIP_VERSION=


# Namespace to install Kube-VIP into
#
export KUBEVIP_NAMESPACE=kube-vip


# Kube-VIP Network Interface
#
export KUBEVIP_INTERFACE=


# Kube-VIP virtual IP address
#
export KUBEVIP_ADDRESS=


# Kube-VIP Control Plane Enable
#
# Options: true|false
#
# Default: true
#
export KUBEVIP_CP_ENABLE=true


# Kube-VIP VIP Leader Election
#
# Options: true|false
#
# Default: true
#
export KUBEVIP_VIP_LEADERELECTION=true


############################################################################
#   Cert-Manager Variables
############################################################################

# Cert-Manager Helm Install URL
# 
# The Helm repo to install Cert-Manager from.
#
# The upstream repo is: https://charts.jetstack.io
#
export CERTMANAGER_HELM_REPO="https://charts.jetstack.io"


# Cert-Manager Helm Chart
#
# If this variable is set then the CERTMANAGER_HELM_REPO is ignored and 
# this chart is used to install Cert-Manager instead.
#
# The upstream chart is: oci://quay.io/jetstack/charts/cert-manager
# The AppCo chart is: oci://dp.apps.rancher.io/charts/cert-manager
#
export CERTMANAGER_HELM_CHART=


# Version of Cert-Manager to Install
#
# If left empty the latest version will be installed.
#
export CERTMANAGER_VERSION=


# Namespace to install Cert-Manager into
#
export CERTMANAGER_NAMESPACE=cert-manager


############################################################################
#   Trust-Manager Variables
############################################################################

# Trust-Manager Helm Install URL
# 
# The Helm repo to install Trust-Manager from.
#
# The upstream repo is: https://charts.jetstack.io
#
export TRUSTMANAGER_HELM_REPO="https://charts.jetstack.io"


# Trust-Manager Helm Chart
#
# If this variable is set then the TRUSTMANAGER_HELM_REPO is ignored and 
# this chart is used to install Trust-Manager instead.
#
# The upstream chart is: oci://quay.io/jetstack/charts/trust-manager
# The AppCo chart is: oci://dp.apps.rancher.io/charts/trust-manager
#
export TRUSTMANAGER_HELM_CHART=


# Version of Trust-Manager to Install
#
# If left empty the latest version will be installed.
#
export TRUSTMANAGER_VERSION=


# Namespace to install Trust-Manager into
#
# The upstream defaults to installing Trust-Manager into the same namespace as 
# Cert-Manager becuase, unless configured differently, by default it depends on
# Cert-Manager.
#
export TRUSTMANAGER_NAMESPACE=cert-manager


# The Default Namespace Where Secrets will be Read
#
# The upstream Cert-Manager default for this is "cert-manager"
# however for our deployments we put it in its own namespace dedicated to 
# Trust-Manager as recommeded by the documentation.
#
export TRUSTMANAGER_APP_TRUST_NAMESPACE=trust-manager


# Enable secretTargets
#
# Default: false
#
export TRUSTMANAGER_SECRETTARGETS_ENABLED=false


# Allow Trust-Manager to have read/write perms for all secrets in the cluster
#
# Note that if TRUSTMANAGER_SECRETTARGETS_ENABLED=false then this is ignored.
#
# Deafult: false
#
expost TRUSTMANAGER_AUTHORIZEDSECRETSALL=false
